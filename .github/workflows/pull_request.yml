name: Code quality

on:
    push:
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Check formatting and lint
              run: npm run check
